# HTTP → 重定向到 HTTPS + Let's Encrypt 验证
server {
    listen 80;
    server_name s.pmlab.top;

    # Certbot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name s.pmlab.top;

    ssl_certificate     /etc/letsencrypt/live/s.pmlab.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s.pmlab.top/privkey.pem;

    # 前端静态文件
    location / {
        root /var/www/stock-monitor;
        try_files $uri $uri/ /index.html;
    }

    # 飞书 Webhook
    location /webhook/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 健康检查
    location /health {
        proxy_pass http://app:8000;
    }
}
