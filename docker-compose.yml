services:
  app:
    build: .
    container_name: stock-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # 2026-09-17: redis 容器已停用（见下方 redis 服务注释），URL 保留备查
      # REDIS_URL: redis://stock-redis:6379/0
      TZ: Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: 1.2g
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./web:/app/web
      - ./web-v2/dist:/app/web-v2/dist
    depends_on:
      db:
        condition: service_healthy
      # 2026-09-17: redis 停用，随服务一并注释
      # redis:
      #   condition: service_healthy
    networks:
      - stock-net

  db:
    image: postgres:15-alpine
    container_name: stock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock123}
      POSTGRES_DB: ${POSTGRES_DB:-stock_monitor}
      TZ: Asia/Shanghai
    # /dev/shm 默认仅 64MB，并行 VACUUM 会报
    # "could not resize shared memory segment ... No space left on device"
    # （2026-09-10 迁移后实测撞到）。
    # 关键机制：并行 VACUUM 申请的共享内存段大小 ≈ maintenance_work_mem。
    # 因此 shm_size 必须明显大于 maintenance_work_mem（当前 1GB），留 2 倍余量。
    # 否则普通 VACUUM 与 autovacuum 都会失败。
    # 注意：需重建容器才生效（docker compose up -d db），数据在 bind mount 中不受影响。
    shm_size: 2g
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
      # 备份专用：pg_dump -Fd 在容器内直写宿主 ext4（绕开 docker exec 的 stdout 管道，
      # 那层在内存吃紧时会 ENOMEM；scripts/backup_qiniu.sh 依赖此挂载）
      - ./data/backups/db:/dbbackup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stock}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stock-net

  # 2026-09-17: redis 停用——全代码库唯一引用是飞书对话历史且仅 APP_ENV=prod 走
  # Redis（生产已拆除，本地 dev 用内存实现）；单用户系统无读缓存需求，热聚合
  # 走 Postgres 物化表（treemap/stats/entity_stats cache，事务一致无失效问题）。
  # 若未来启用（如 tushare 配额跨进程原子计数），取消注释并 docker compose up -d redis。
  # redis:
  #   image: redis:7-alpine
  #   container_name: stock-redis
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - ./data/redis:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - stock-net

  # nginx 由宿主机提供，反代到 app:8000
  # 宿主机 nginx 配置文件见 nginx/host-nginx.conf

  # certbot 由宿主机管理。首次申请证书:
  #   certbot certonly --webroot -w /usr/local/htdoc/stone/web -d s.pmlab.top
  # 自动续期:
  #   echo "0 3 * * * certbot renew --quiet && systemctl reload nginx" | crontab -

networks:
  stock-net:
    driver: bridge
