<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>登录 - 悟道</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#101014;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .box{background:#1e1e22;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:40px;width:380px;max-width:90vw}
    .box h1{font-size:24px;text-align:center;margin-bottom:4px}
    .box .sub{font-size:11px;color:rgba(255,255,255,.38);text-align:center;margin-bottom:28px}
    .box label{font-size:11px;color:rgba(255,255,255,.55);display:block;margin-bottom:4px;margin-top:14px}
    .box input{width:100%;background:#101014;border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px 14px;border-radius:8px;font-size:14px;outline:none}
    .box input:focus{border-color:#2080f0}
    .box button{width:100%;background:#2080f0;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-size:14px;margin-top:20px}
    .box .err{color:#d03050;font-size:11px;text-align:center;margin-top:8px;min-height:16px}
  </style>
</head>
<body>
<div class="box" id="app">
  <h1>悟道</h1>
  <div class="sub">Stock Signal Monitor</div>
  <label>用户名</label>
  <input v-model="u" @keyup.enter="login" placeholder="admin">
  <label>密码</label>
  <input v-model="p" type="password" @keyup.enter="login" placeholder="••••••">
  <button @click="login" :disabled="ld">{{ld?'登录中…':'登 录'}}</button>
  <div class="err">{{err}}</div>
</div>
<script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/axios/1.6.7/axios.min.js"></script>
<script>
const {createApp,ref}=Vue;
createApp({setup(){
  const u=ref(''),p=ref(''),err=ref(''),ld=ref(false);
  async function login(){
    err.value='';ld.value=true;
    try{
      const r=await axios.post('/api/login',{username:u.value,password:p.value});
      localStorage.setItem('token',r.data.token);localStorage.setItem('username',r.data.username);
      window.location.href='/';
    }catch(e){err.value=e.response?.data?.detail||'登录失败'}
    ld.value=false
  }
  if(localStorage.getItem('token')) window.location.href='/';
  return{u,p,err,ld,login}
}}).mount('#app');
</script>
</body>
</html>
