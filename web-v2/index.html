<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="K道 · A 股买卖点监测：行情、信号、模型评估与数据流水线">
  <title>个股买卖点监测系统</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    /* 首屏前定主题，避免深色模式闪白（tokens.css 由模块加载，晚于首帧） */
    (function () {
      try {
        var m = localStorage.getItem('theme-mode')
        var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) { /* 隐私模式：保持浅色 */ }
    })()
  </script>
  <style>
    /* 全屏 App：锁定 body 防止触摸手势拖动整个文档（H5 关键） */
    html, body { position: fixed; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0;
      overflow: hidden; overscroll-behavior: none; background: #f6f5f1; font-variant-numeric: tabular-nums; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #121417; }
    #app { height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
