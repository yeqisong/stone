<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>个股买卖点监测系统</title>
<script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/axios/1.6.7/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<!-- Element Plus -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/theme-chalk/dark/css-vars.css">
<script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
<script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue"></script>
<style>
/* ── 自定义变量（补 Element Plus dark 变量未覆盖的部分） ── */
:root{--bg-card:#1e293b;--gold:#f59e0b}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}

/* ── 布局 ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--el-border-color-light)}
.header h1{font-size:18px}.st{font-size:11px;color:var(--el-text-color-secondary)}
.tabs{display:flex;align-items:center;gap:4px;padding:8px 24px;border-bottom:1px solid var(--el-border-color-light);background:var(--el-bg-color-overlay)}
.content{padding:14px 20px;max-width:1500px;margin:0 auto}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.si{background:var(--el-bg-color-overlay);border:1px solid var(--el-border-color-light);border-radius:8px;padding:12px;text-align:center}
.si .v{font-size:24px;font-weight:700}.si .l{font-size:10px;color:var(--el-text-color-secondary)}
.g{color:var(--el-color-success)}.r{color:var(--el-color-danger)}
.stars{color:var(--gold)}
.stock-table{margin-top:8px}
.search-box{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:14px 16px;background:var(--el-bg-color-overlay);border:1px solid var(--el-border-color-light);border-radius:10px}
.search-box .info{font-size:12px;color:var(--el-text-color-secondary);margin-left:auto;white-space:nowrap}
.pager{display:flex;justify-content:center;margin-top:14px}
.disclaimer{text-align:center;color:var(--el-text-color-placeholder);font-size:10px;padding:12px}

/* ── 加载状态 ── */
.loading{text-align:center;padding:40px;color:var(--el-text-color-secondary)}
.error-state{text-align:center;padding:20px;color:var(--el-text-color-secondary);font-size:12px}
.error-state .msg{color:var(--el-color-danger);margin-bottom:6px}

/* ── 日历网格（保留手写） ── */
.cal-cell{cursor:pointer;transition:all .12s}.cal-cell:hover{filter:brightness(1.15)}
.cal-syncing{animation:pulse 1s infinite}@keyframes pulse{0%{opacity:1}50%{opacity:0.5}100%{opacity:1}}
</style>
</head>
<body>
<div id="app">
<div class="header"><div><h1>📊 个股买卖点监测系统</h1><div class="st">Stock Signal Monitor</div></div><div style="display:flex;align-items:center;gap:16px"><span class="st" style="cursor:pointer" @click="doLogout" title="退出登录">👤 {{loginUser}} | 退出</span><div class="st">{{health.ok?'正常':'异常'}} | {{overview.latest_date||'-'}}</div></div></div>
<div style="display:flex;align-items:center;gap:4px;padding:8px 24px;border-bottom:1px solid var(--el-border-color-light);background:var(--el-bg-color-overlay)">
<el-button :type="tab==='p'?'primary':''" size="small" @click="switchTab('p')">📈 持仓</el-button>
<el-button :type="tab==='s'?'primary':''" size="small" @click="switchTab('s')">🔍 买点</el-button>
<el-button :type="tab==='l'?'primary':''" size="small" @click="switchTab('l')">📋 个股</el-button>
<el-button :type="tab==='d'?'primary':''" size="small" @click="tab='d'">📊 详情</el-button>
<el-button :type="tab==='x'?'primary':''" size="small" @click="switchTab('x')">⚙️ 状态</el-button>
<el-button :type="tab==='o'?'primary':''" size="small" @click="switchTab('o')">🔧 设置</el-button>
</div>
<div class="content">

<!-- 持仓 -->
<div v-if="tab==='p'">
<div class="loading" v-if="ld.p"><el-icon class="is-loading" style="font-size:24px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-linecap="round"></circle></svg></el-icon><div style="margin-top:8px">加载持仓数据...</div></div>
<template v-else>
<div class="summary"><div class="si"><div class="v">{{ptf.count}}</div><div class="l">持仓</div></div><div class="si"><div class="v">¥{{fmt(ptf.total_value)}}</div><div class="l">市值</div></div><div class="si"><div class="v" :class="ptf.total_pnl>=0?'g':'r'">¥{{fmt(ptf.total_pnl)}}</div><div class="l">盈亏</div></div></div>
<!-- 新增表单 -->
<div class="card" v-if="showAdd">
<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
<div><div style="font-size:11px;color:var(--el-text-color-secondary);margin-bottom:4px">代码</div><el-input v-model="pf.code" placeholder="000001" style="width:110px" size="default" clearable></el-input></div>
<div><div style="font-size:11px;color:var(--el-text-color-secondary);margin-bottom:4px">数量</div><el-input-number v-model="pf.qty" :min="1" style="width:110px" size="default"></el-input-number></div>
<div><div style="font-size:11px;color:var(--el-text-color-secondary);margin-bottom:4px">成本价</div><el-input-number v-model="pf.cost" :precision="2" :step="0.01" :min="0" style="width:130px" size="default"></el-input-number></div>
<div><div style="font-size:11px;color:var(--el-text-color-secondary);margin-bottom:4px">备注</div><el-input v-model="pf.note" placeholder="备注" style="width:140px" size="default" clearable></el-input></div>
<el-button type="primary" @click="addPosition">添加</el-button>
<el-button @click="showAdd=false">取消</el-button>
</div></div>
<el-button v-else type="primary" plain size="small" @click="showAdd=true" style="margin-bottom:10px">+ 新增持仓</el-button>
<div class="card"><h3>持仓明细</h3>
<el-table v-if="ptf.positions&&ptf.positions.length" :data="ptf.positions" stripe highlight-current-row size="small" @row-click="(r)=>editingPos!==r.stock_code?showDetail(r.stock_code):null" style="width:100%">
<el-table-column prop="stock_code" label="代码" min-width="85"></el-table-column>
<el-table-column prop="stock_name" label="名称" min-width="100"></el-table-column>
<el-table-column prop="quantity" label="数量" width="70" align="right"></el-table-column>
<el-table-column label="成本" width="95" align="right"><template #default="{row:p}">¥{{(p.cost_price||0).toFixed(2)}}</template></el-table-column>
<el-table-column label="现价" width="95" align="right"><template #default="{row:p}">¥{{(p.current_price||0).toFixed(2)}}</template></el-table-column>
<el-table-column label="市值" width="105" align="right"><template #default="{row:p}">¥{{fmt(p.market_value)}}</template></el-table-column>
<el-table-column label="盈亏" min-width="120" align="right"><template #default="{row:p}"><span :style="{color:p.pnl>=0?'var(--el-color-success)':'var(--el-color-danger)'}">¥{{fmt(p.pnl)}} ({{(p.pnl_pct||0)>=0?'+':''}}{{(p.pnl_pct||0).toFixed(1)}}%)</span></template></el-table-column>
<el-table-column prop="notes" label="备注" min-width="80">
<template #default="{row:p}"><span style="font-size:11px;color:var(--el-text-color-secondary)">{{p.notes||''}}</span></template>
</el-table-column>
<el-table-column label="操作" width="65" fixed="right">
<template #default="{row:p}">
<el-button link size="small" @click.stop="startEditPos(p)">✎</el-button>
<el-button type="danger" link size="small" @click.stop="delPosition(p.stock_code)">✕</el-button>
</template>
</el-table-column>
</el-table>
<el-empty v-else-if="!ld.p" description="暂无持仓"></el-empty>
</tr></tbody></table><div v-else style="color:var(--el-text-color-secondary);padding:20px;text-align:center">暂无持仓，点击上方"+ 新增持仓"添加</div>
<div class="error-state" v-if="ldErr.p"><div class="msg">{{ldErr.p}}</div></div>
</div></template></div>

<!-- 买点 -->
<div v-if="tab==='s'">
<div class="loading" v-if="ld.s"><span style="font-size:24px">⏳</span><div style="margin-top:8px">正在扫描全市场买点...</div></div>
<template v-else>
<div class="card"><h3>🔍 全市场买点</h3>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">
<span style="font-size:12px;color:var(--el-text-color-secondary)">日期:</span>
<el-date-picker v-model="sigDate" type="date" value-format="YYYY-MM-DD" @change="loadSignals()" style="width:150px" size="default"></el-date-picker>
<el-button size="small" @click="sigDate=todayStr();loadSignals()">今天</el-button>
<el-tag v-if="todayStrategy&&todayStrategy.strategy_date!==sigDate" type="warning" size="small" effect="plain">⚠️ 该日策略未运行或无数据</el-tag>
</div>
<div style="font-size:12px;color:var(--el-text-color-secondary);margin-bottom:10px">扫描 <b>{{sigs.scanned}}</b> 只, 买入信号 <b>{{sigs.total_signals}}</b> 只</div>
<el-table v-if="sigs.signals" :data="sigs.signals" stripe highlight-current-row size="small" @row-click="(r)=>showDetail(r.stock_code)" style="width:100%">
<el-table-column type="index" label="#" width="45"></el-table-column>
<el-table-column prop="stock_code" label="代码" min-width="85"></el-table-column>
<el-table-column prop="stock_name" label="名称" min-width="100"></el-table-column>
<el-table-column label="现价" width="95" align="right"><template #default="{row:s}">¥{{(s.price||0).toFixed(2)}}</template></el-table-column>
<el-table-column label="方向" width="55"><template #default><el-tag type="danger" size="small" effect="dark">买</el-tag></template></el-table-column>
<el-table-column label="强度" width="80"><template #default="{row:s}"><span style="color:var(--el-color-warning)">{{stars(s.strength)}}</span></template></el-table-column>
<el-table-column label="策略" min-width="200"><template #default="{row:s}"><span style="font-size:11px">{{srcStr(s)}}</span></template></el-table-column>
</el-table>
<el-empty v-else description="暂无信号"></el-empty>
<div class="error-state" v-if="ldErr.s"><div class="msg">{{ldErr.s}}</div></div>
</div></template></div>

<!-- 个股/指数列表 -->
<div v-if="tab==='l'">
<div class="loading" v-if="ld.l"><span style="font-size:24px">⏳</span><div style="margin-top:8px">加载列表中...</div></div>
<template v-else>
<div class="card">
<!-- 子标签：个股 / 指数 -->
<div style="display:flex;gap:6px;margin-bottom:12px">
<el-button :type="stockCat==='stock'?'primary':''" size="small" @click="switchCat('stock')">📌 个股</el-button>
<el-button :type="stockCat==='index'?'primary':''" size="small" @click="switchCat('index')">📊 指数</el-button>
<el-button :type="stockCat==='etf'?'primary':''" size="small" @click="switchCat('etf')">💹 ETF</el-button>
</div>
<div class="search-box">
<el-input v-model="kw" @keyup.enter="loadStocks(1)" placeholder="搜索代码或名称..." clearable style="max-width:260px" size="default">
<template #prefix><span style="color:var(--el-text-color-secondary)">🔍</span></template>
</el-input>
<el-button type="primary" @click="loadStocks(1)">搜索</el-button>
<span class="info">共 <b>{{stocks.total}}</b> 条 · 第 <b>{{stocks.page}}</b>/{{stocks.total_pages}} 页</span></div>
<div class="stock-table">
<el-table v-if="stocks.stocks" :data="stocks.stocks" stripe highlight-current-row size="small" @row-click="(r)=>showDetail(r.stock_code)" style="width:100%">
<el-table-column prop="stock_code" label="代码" min-width="85"></el-table-column>
<el-table-column prop="stock_name" label="名称" min-width="100"></el-table-column>
<el-table-column label="交易所" width="55"><template #default="{row:s}">{{exName(s.exchange)}}</template></el-table-column>
<el-table-column label="最新价" width="100" align="right"><template #default="{row:s}"><span style="font-weight:600">¥{{(s.price||0).toFixed(2)}}</span></template></el-table-column>
<el-table-column label="PE" width="70" align="right"><template #default="{row:s}"><span :style="{color:s.pe_ttm>0?'var(--el-color-success)':'var(--el-color-danger)'}">{{s.pe_ttm? s.pe_ttm.toFixed(1):'-'}}</span></template></el-table-column>
<el-table-column prop="industry" label="行业" min-width="100"></el-table-column>
<el-table-column prop="data_rows" label="数据" width="65" align="right"></el-table-column>
</el-table>
<el-empty v-else-if="!ld.l" description="无数据"></el-empty>
</div>
<div class="pager" v-if="stocks.total_pages>1">
<el-pagination background layout="total,prev,pager,next" :total="stocks.total" :page-size="20" :current-page="stocks.page" @current-change="loadStocks" small></el-pagination>
</div>
<div class="error-state" v-if="ldErr.l"><div class="msg">{{ldErr.l}}</div></div>
</div></template></div>

<!-- 个股详情 -->
<div v-if="tab==='d'">
<div class="loading" v-if="ld.d"><span style="font-size:24px">⏳</span><div style="margin-top:8px">加载个股数据...</div></div>
<template v-else>
<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
<el-input v-model="dcode" @keyup.enter="showDetail(dcode)" placeholder="6位代码" style="width:150px" size="default" clearable><template #append><el-button @click="showDetail(dcode)">查询</el-button></template></el-input></div>
<div v-if="detail">
<div class="summary"><div class="si"><div class="v">{{detail.stock_name}}</div><div class="l">{{detail.stock_code}}</div></div><div class="si"><div class="v">¥{{(detail.close||0).toFixed(2)}}</div><div class="l">最新价</div></div><div class="si"><div class="v">{{detail.latest_trade_date}}</div><div class="l">数据日期</div></div><div class="si"><div class="v">{{hcnt}}</div><div class="l">历史信号</div></div></div>
<div class="card" style="min-height:60px"><h3>🎯 策略信号 ({{detail.latest_signal_date||detail.latest_trade_date}})</h3>
<div v-if="detail.latest_signals&&detail.latest_signals.length" style="display:flex;gap:10px;flex-wrap:wrap">
<div v-for="s in detail.latest_signals" style="flex:1;min-width:220px">
<el-card shadow="never" :style="{borderLeft: s.combined_signal?'3px solid var(--gold)':'1px solid var(--el-border-color-light)'}" body-style="padding:12px 14px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
<el-tag :type="s.direction==='buy'?'danger':s.direction==='sell'?'success':'info'" size="small" effect="dark">{{dirName(s.direction)}}</el-tag>
<span v-if="s.combined_signal" style="color:var(--gold);font-size:13px;font-weight:600">★{{s.strength}} 融合信号</span>
<span v-else style="color:var(--el-color-warning);font-size:12px">{{stars(s.strength)}}</span>
</div>
<div style="font-size:12px;color:var(--el-text-color-regular);line-height:1.5">{{s.reason}}</div>
</el-card></div></div>
<el-empty v-else description="暂无信号" :image-size="60"></el-empty></div>
<!-- 左右布局 -->
<div style="display:flex;gap:12px;flex-wrap:wrap">
<div style="flex:1;min-width:400px">
<div class="card"><h3>📈 K线图 <span style="font-size:11px;color:var(--el-text-color-secondary);font-weight:400;margin-left:8px">{{dateRange}}</span>
<el-select v-model="adj" @change="reloadChart" size="small" style="width:105px;margin-left:8px">
<el-option value="none" label="不复权"></el-option>
<el-option value="qfq" label="前复权"></el-option>
<el-option value="hfq" label="后复权"></el-option>
</el-select></h3>
<div id="c1" style="width:100%;height:340px"></div></div>
<div class="card"><h3>📊 成交量</h3><div id="c2" style="width:100%;height:180px"></div></div>
<div class="card"><h3>📉 MACD</h3><div id="c3" style="width:100%;height:180px"></div></div>
<div class="card"><h3>📐 RSI</h3><div id="c4" style="width:100%;height:180px"></div></div>
</div>
<div style="width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:12px">
<div class="card" style="margin-bottom:0"><h3>🏢 基本面</h3>
<el-descriptions v-if="detail.fundamentals&&detail.fundamentals.industry" :column="1" border size="small" label-width="85px">
<el-descriptions-item label="行业">{{detail.fundamentals.industry||'-'}}</el-descriptions-item>
<el-descriptions-item label="PE(TTM)">
<el-tag :type="detail.fundamentals.pe_ttm>0?(detail.fundamentals.pe_ttm<30?'success':'warning'):'danger'" size="small" effect="plain">{{detail.fundamentals.pe_ttm?detail.fundamentals.pe_ttm.toFixed(1):'-'}}</el-tag>
</el-descriptions-item>
<el-descriptions-item label="PB">{{detail.fundamentals.pb_mrq?detail.fundamentals.pb_mrq.toFixed(2):'-'}}</el-descriptions-item>
<el-descriptions-item label="ROE">
<el-tag :type="detail.fundamentals.roe>15?'success':detail.fundamentals.roe>5?'warning':'danger'" size="small" effect="plain">{{detail.fundamentals.roe?detail.fundamentals.roe.toFixed(1)+'%':'-'}}</el-tag>
</el-descriptions-item>
<el-descriptions-item label="营收同比">
<el-tag :type="detail.fundamentals.revenue_yoy>0?'success':'danger'" size="small" effect="plain">{{detail.fundamentals.revenue_yoy!=null?detail.fundamentals.revenue_yoy.toFixed(1)+'%':'-'}}</el-tag>
</el-descriptions-item>
<el-descriptions-item label="净利同比">
<el-tag :type="detail.fundamentals.profit_yoy>0?'success':'danger'" size="small" effect="plain">{{detail.fundamentals.profit_yoy!=null?detail.fundamentals.profit_yoy.toFixed(1)+'%':'-'}}</el-tag>
</el-descriptions-item>
</el-descriptions>
<el-empty v-else description="暂无基本面数据" :image-size="50"></el-empty></div>
<div class="card" style="margin-bottom:0"><h3>📊 行情概览</h3>
<el-descriptions :column="1" border size="small" label-width="85px">
<el-descriptions-item label="最新价"><span style="font-weight:600">¥{{(detail.close||0).toFixed(2)}}</span></el-descriptions-item>
<el-descriptions-item label="后复权价">¥{{detail.close_hfq?detail.close_hfq.toFixed(2):'-'}}</el-descriptions-item>
<el-descriptions-item label="成交量">{{fmt(detail.volume)}}股</el-descriptions-item>
<el-descriptions-item label="换手率">{{detail.turnover?detail.turnover.toFixed(2):'-'}}%</el-descriptions-item>
<el-descriptions-item label="数据日期">{{detail.latest_trade_date}}</el-descriptions-item>
</el-descriptions></div>
</div></div>
</div></div>
<div class="error-state" v-if="ldErr.d"><div class="msg">{{ldErr.d}}</div></div>
</template></div>

<!-- 数据状态 -->
<div v-if="tab==='x'">
<div class="loading" v-if="ld.x"><span style="font-size:24px">⏳</span><div style="margin-top:8px">加载状态数据...</div></div>
<template v-else>
<div class="summary" v-if="overview.total_stocks"><div class="si"><div class="v">{{fmt(overview.total_rows)}}</div><div class="l">行情总条数</div></div><div class="si"><div class="v">{{overview.total_stocks}}</div><div class="l">股票</div></div><div class="si"><div class="v">{{overview.latest_date||'-'}}</div><div class="l">最新数据</div></div><div class="si" style="border:1px solid var(--gold)"><div class="v go">{{missingDates.length}}</div><div class="l">漏数据日期</div></div></div>
<!-- 今日策略运行状态 -->
<div class="card" v-if="todayStrategy" :style="{borderLeft: todayStrategy.status==='ok'?'3px solid var(--el-color-danger)':'3px solid #f59e0b'}"><h3>🎯 今日策略运行 ({{todayStrategy.strategy_date||'-'}})</h3>
<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px">
<div><span style="color:var(--el-text-color-secondary)">扫描:</span> <b>{{todayStrategy.scanned||0}}</b> 只</div>
<div><span style="color:var(--el-text-color-secondary)">信号:</span> <b>{{todayStrategy.total_signals||0}}</b></div>
<div><span style="color:var(--el-text-color-secondary)">买入:</span> <b style="color:var(--el-color-danger)">{{todayStrategy.buy_signals||0}}</b></div>
<div><span style="color:var(--el-text-color-secondary)">偏好:</span> {{todayStrategy.preference||'-'}}</div>
<div><span style="color:var(--el-text-color-secondary)">耗时:</span> {{todayStrategy.elapsed_seconds||0}}s</div>
<div><span style="color:var(--el-text-color-secondary)">执行:</span> {{todayStrategy.time||'-'}}</div>
</div></div>
<div class="card"><h3>📊 交易所</h3><table><thead><tr><th>交易所</th><th>最新日期</th><th>行情</th><th>股票</th></tr></thead><tbody><template v-for="(v,k) in overview.exchanges"><tr v-if="v&&v.stocks>0"><td>{{exFull(k)}}</td><td>{{v.latest_date||'-'}}</td><td>{{fmt(v.rows)}}</td><td>{{v.stocks}}</td></tr></template></tbody></table></div>
<div class="card"><h3>📅 交易日历 & 数据完整度</h3>
<div style="display:flex;align-items:center;gap:6px;margin-bottom:10px"><el-button size="small" @click="prevMonth">◀</el-button><span style="font-weight:600;font-size:14px;min-width:80px;text-align:center">{{smonthLabel}}</span><el-button size="small" @click="nextMonth">▶</el-button><el-button size="small" type="primary" plain @click="smonth=(new Date()).toISOString().slice(0,7);loadDataStatus()">今天</el-button><span style="font-size:10px;color:var(--el-text-color-secondary);margin-left:8px">🟢≥80% 🟡50-80% 🔴&lt;50% ⚫非交易日 ⚪未来</span></div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:10px;color:var(--el-text-color-secondary);margin-bottom:3px"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span style="color:#ef4444">六</span><span style="color:#ef4444">日</span></div>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">
<div v-for="d in cal" :style="calStyle(d)" :title="calTitle(d)" @contextmenu.prevent="doSyncDate(d)" @click="doSyncClick(d)" :class="{'cal-cell':true,'cal-syncing':d.syncing}">{{d.day}}<div v-if="d.td&&d.cp" :style="{fontSize:'7px',marginTop:'1px',color:d.cp.pct>=80?'#10b981':d.cp.pct>=50?'#f59e0b':'#ef4444'}">{{d.cp.pct}}%</div><div v-if="d.syncing" style="font-size:7px;color:var(--blue);margin-top:1px">⟳ 采集中</div></div></div></div>
<div class="card" v-if="missingDates.length"><h3>⚠️ 近期数据异常</h3>
<div style="font-size:12px;color:var(--el-text-color-secondary)">以下交易日数据不完整或完全缺失:</div>
<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px"><span v-for="d in missingDates" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);padding:2px 8px;border-radius:4px;font-size:11px">{{d}}</span></div></div>
<!-- 最近下载日志 -->
<div class="card" v-if="dlog.length"><h3>📥 最近下载记录</h3>
<div style="font-size:11px"><div v-for="l in dlog.slice(0,8)" style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--el-border-color-light);font-size:11px">
<span style="min-width:100px;color:var(--el-text-color-secondary)">{{l.time}}</span>
<span :style="{color:l.status==='ok'?'#10b981':l.status==='warn'?'#f59e0b':'#ef4444',fontWeight:500}">{{l.status==='ok'?'✅':l.status==='warn'?'⚠️':'❌'}}</span>
<span style="color:var(--el-text-color-secondary)">+{{l.rows}}行</span>
<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--el-text-color-secondary)">{{l.detail||''}}</span></div></div></div></div>
<div class="error-state" v-if="ldErr.x"><div class="msg">{{ldErr.x}}</div></div>
</template></div>

<!-- ═══ 设置 ═══ -->
<div v-if="tab==='o'">
<div class="loading" v-if="ld.o"><span style="font-size:24px">⏳</span><div style="margin-top:8px">加载设置...</div></div>
<template v-else>
<div class="card"><h3>🔧 系统设置</h3></div>
<div class="card"><h3>🎯 全局交易偏好</h3>
<div style="display:flex;gap:8px;margin-bottom:10px">
<el-radio-group v-model="prefMode" @change="setPreference">
  <el-radio-button value="left">左侧(早触发)</el-radio-button>
  <el-radio-button value="balanced">均衡</el-radio-button>
  <el-radio-button value="right">右侧(晚确认)</el-radio-button>
</el-radio-group></div>
<div v-if="prefMode" style="font-size:12px;color:var(--el-text-color-secondary)">
当前: <el-tag :type="prefMode==='left'?'danger':prefMode==='right'?'success':'warning'" size="small" effect="plain">{{prefMode==='left'?'左侧交易(早触发)':prefMode==='right'?'右侧交易(晚确认)':'均衡'}}</el-tag></div></div>
<div class="card"><h3>📊 策略启停</h3>
<template v-for="s in cfg.strategies"><div v-if="s.name!=='global_preference'" style="padding:12px 0;border-bottom:1px solid var(--el-border-color-light)"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div style="flex:1"><b>{{s.display||s.name}}</b><div style="font-size:11px;color:var(--el-text-color-secondary);margin-top:4px">
<template v-if="editing!==s.name"><code style="font-size:10px;background:var(--el-fill-color-light);padding:2px 6px;border-radius:3px">{{JSON.stringify(s.params)}}</code></template>
<el-input v-else v-model="editParams" size="small" style="font-family:monospace"></el-input>
</div></div>
<div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
<el-switch v-model="s.enabled" @change="toggleStrategy(s.name,$event)" style="margin-right:4px"></el-switch>
<template v-if="editing===s.name">
<el-button type="primary" size="small" @click="saveParams(s.name)">保存</el-button>
<el-button size="small" @click="editing=''">取消</el-button>
</template>
<el-button v-else size="small" circle @click="editParams=JSON.stringify(s.params);editing=s.name">✎</el-button>
</div></div></div></template></div>
<div class="card"><h3>🤖 DeepSeek API Key</h3>
<div style="display:flex;gap:10px;align-items:center"><el-input v-model="dsKey" type="password" placeholder="sk-..." show-password style="max-width:320px" size="default"></el-input><el-button type="primary" @click="saveDsKey">保存</el-button></div>
<div style="font-size:11px;color:var(--el-text-color-secondary);margin-top:6px">{{cfg.deepseek_configured?'✅ 已配置':'⚠️ 未配置'}}</div></div></div>

<div class="disclaimer">⚠️ 本系统所有分析仅供参考，不构成投资建议。</div>
<div class="error-state" v-if="ldErr.o"><div class="msg">{{ldErr.o}}</div></div>

<!-- 编辑持仓对话框 -->
<el-dialog v-model="editingPos" title="✎ 编辑持仓" width="380px" destroy-on-close>
  <el-form label-width="70px">
    <el-form-item label="数量"><el-input-number v-model="editPos.qty" :min="0" style="width:100%"></el-input-number></el-form-item>
    <el-form-item label="成本价"><el-input-number v-model="editPos.cost" :precision="2" :step="0.01" :min="0" style="width:100%"></el-input-number></el-form-item>
    <el-form-item label="备注"><el-input v-model="editPos.note" type="textarea" :rows="2"></el-input></el-form-item>
  </el-form>
  <template #footer>
    <el-button @click="editingPos=''">取消</el-button>
    <el-button type="primary" @click="savePosition(editingPos)">保存</el-button>
  </template>
</el-dialog>

<!-- Element Plus 对话框 (代替自写 Modal) -->
<el-dialog v-model="modal.show" :title="modal.icon+' '+modal.title" width="380px" :close-on-click-modal="false" destroy-on-close>
  <div style="text-align:center;padding:8px 0">
    <div style="font-size:48px;margin-bottom:12px">{{modal.icon}}</div>
    <div class="msg" v-html="modal.msg" style="font-size:14px;color:var(--el-text-color-secondary);line-height:1.6"></div>
  </div>
  <template #footer>
    <span v-if="modal.type==='alert'">
      <el-button type="primary" @click="modalClose">确 定</el-button>
    </span>
    <span v-if="modal.type==='confirm'">
      <el-button @click="modalClose">取 消</el-button>
      <el-button :type="modal.danger?'danger':'primary'" @click="modalDoConfirm">{{modal.confirmText||'确 认'}}</el-button>
    </span>
  </template>
</el-dialog>

</template></div></div>

<script>
var API=window.location.origin;
var {createApp,ref,reactive,onMounted,nextTick}=Vue;

var app = createApp({setup(){
var tab=ref('p'),health=reactive({ok:false});
var loginUser=ref(localStorage.getItem('username')||'admin');
function doLogout(){localStorage.clear();window.location.href='/login.html'}
// 全局加载状态
var ld=reactive({p:false,s:false,l:false,d:false,x:false,o:false});
var ldErr=reactive({p:'',s:'',l:'',d:'',x:'',o:''});
var ptf=reactive({positions:null,count:0,total_value:0,total_pnl:0});
var sigs=reactive({signals:null,signal_date:'',scanned:0,total_signals:0});
var sigDate=ref(new Date().toISOString().slice(0,10));
function todayStr(){return new Date().toISOString().slice(0,10)}
var stocks=reactive({stocks:[],total:0,page:1,total_pages:1});
var stockCat=ref('stock'),kw=ref(''),detail=ref(null),dcode=ref(''),hcnt=ref(0),adj=ref('none'),dateRange=ref('');
var dsKey=ref(''),prefMode=ref(''),cfg=reactive({strategies:[],deepseek_configured:false});
var editing=ref(''),editParams=ref('');
var showAdd=ref(false),pf=reactive({code:'',qty:100,cost:0,note:''});
var editingPos=ref(''),editPos=reactive({qty:0,cost:0,note:''});
var overview=reactive({total_rows:0,total_stocks:0,latest_date:'',exchanges:{}});
var smonth=ref(new Date().toISOString().slice(0,7));
var cal=ref([]),missingDates=ref([]),dlog=ref([]),todayStrategy=ref(null);
var smonthLabel=Vue.computed(function(){var y=parseInt(smonth.value.slice(0,4)),m=parseInt(smonth.value.slice(5,7));return y+'年'+m+'月'});

function fmt(v){return v?Number(v).toLocaleString('zh-CN',{maximumFractionDigits:0}):'0'}
function stars(n){var s=''; for(var i=0;i<(n||0);i++) s+='★'; return s}
function dirName(d){return{buy:'买入',sell:'卖出',neutral:'中性'}[d]||d}
function exName(e){return{SSE:'沪',SZSE:'深',BSE:'京'}[e]||e}
function exFull(e){return{SSE:'上交所',SZSE:'深交所',BSE:'北交所'}[e]||e}
function srcStr(s){var a=s.source_strategies||[]; return a.length? a.join('+'): (s.reason||'').slice(0,20)}

async function checkHealth(){try{var r=await axios.get(API+'/health');health.ok=r.data.status==='ok'}catch(e){health.ok=false}}
async function loadPortfolio(){ld.p=true;ldErr.p='';try{var r=await axios.get(API+'/api/portfolio');Object.assign(ptf,r.data)}catch(e){ldErr.p='加载失败：'+e.message}ld.p=false}
async function addPosition(){if(!pf.code)return;try{await axios.post(API+'/api/portfolio',{stock_code:pf.code,quantity:pf.qty,cost_price:pf.cost,notes:pf.note});showAdd.value=false;pf.code='';pf.qty=100;pf.cost=0;pf.note='';loadPortfolio()}catch(e){modalAlert('添加失败',e.response?.data?.detail||e.message,'❌')}}
function startEditPos(p){editingPos.value=p.stock_code;editPos.qty=p.quantity;editPos.cost=p.cost_price;editPos.note=p.notes||''}
async function savePosition(code){try{await axios.put(API+'/api/portfolio/'+code,{quantity:editPos.qty,cost_price:editPos.cost,notes:editPos.note});editingPos.value='';loadPortfolio()}catch(e){modalAlert('保存失败',e.message,'❌')}}
async function delPosition(code){modalConfirmDanger('确认删除','确定删除该持仓？删除后数据不可恢复。',function(){axios.delete(API+'/api/portfolio/'+code).then(function(){loadPortfolio();modalClose()}).catch(function(e){modalAlert('错误','删除失败: '+(e.response?.data?.detail||e.message),'❌')})})}
async function loadSignals(){ld.s=true;ldErr.s='';try{var r=await axios.get(API+'/api/buy_signals',{params:{signal_date:sigDate.value}});Object.assign(sigs,r.data)}catch(e){ldErr.s='加载失败：'+e.message}ld.s=false}
function switchTab(t){tab.value=t;pushHash(t==='l'?'l/stock':t);if(t==='l'){stockCat.value='stock';stocks.page=1;loadStocks(1)}else if(t==='p')loadPortfolio();else if(t==='s'){sigDate.value=todayStr();loadSignals()}else if(t==='x')loadDataStatus();else if(t==='o')loadSettings()}
function switchCat(c){stockCat.value=c;stocks.page=1;pushHash('l/'+c);loadStocks(1)}
async function loadStocks(p){if(p) stocks.page=p;ld.l=true;ldErr.l='';try{var r=await axios.get(API+'/api/stocks',{params:{page:stocks.page,page_size:20,keyword:kw.value,category:stockCat.value}});Object.assign(stocks,r.data)}catch(e){ldErr.l='加载失败：'+e.message}ld.l=false}
async function showDetail(code){if(!code)return;pushHash('d/'+code);tab.value='d';dcode.value=code;adj.value='none';ld.d=true;ldErr.d='';detail.value=null;var kd=null;try{var r1=await axios.get(API+'/api/stock/'+code+'/detail');detail.value=r1.data;hcnt.value=r1.data.history_count;var r2=await axios.get(API+'/api/stock/'+code+'/kline?days=500&adjust='+adj.value);kd=r2.data}catch(e){detail.value=null;ldErr.d='加载个股失败'}ld.d=false;if(kd){await nextTick();makeCharts(kd)}}
async function loadKline(){if(!dcode.value)return;try{var r2=await axios.get(API+'/api/stock/'+dcode.value+'/kline?days=500&adjust='+adj.value);await nextTick();makeCharts(r2.data)}catch(e){}}
async function reloadChart(){ld.d=true;detail.value=null;var kd=null;try{var r3=await axios.get(API+'/api/stock/'+dcode.value+'/kline?days=500&adjust='+adj.value);kd=r3.data}catch(e){}ld.d=false;if(kd){await nextTick();makeCharts(kd)}}
async function loadDataStatus(){ld.x=true;ldErr.x='';try{var r=await axios.get(API+'/api/data_status?month='+smonth.value);var d=r.data;if(d.overview)Object.assign(overview,d.overview);
var arr=(d.calendar||[]).map(function(x){return{day:parseInt(x.date.slice(8)),td:x.is_trade_day,cp:x.completeness,future:new Date(x.date)>new Date(),date:x.date}});
var y=parseInt(smonth.value.slice(0,4)),m=parseInt(smonth.value.slice(5,7));
var firstDow=new Date(y,m-1,1).getDay();var offset=firstDow===0?6:firstDow-1;
var pad=[]; for(var i=0;i<offset;i++) pad.push({day:'',td:false,cp:null,future:false,date:''});
cal.value=pad.concat(arr);missingDates.value=d.missing_dates||[];dlog.value=d.download_log||[];todayStrategy.value=d.today_strategy||null}catch(e){ldErr.x='加载状态页失败'}ld.x=false}
async function loadSettings(){ld.o=true;ldErr.o='';try{var r=await axios.get(API+'/api/settings');Object.assign(cfg,r.data);var p=cfg.strategies.find(function(s){return s.name==='global_preference'});if(p)prefMode.value=p.params.mode||'balanced'}catch(e){ldErr.o='加载设置失败'}ld.o=false}
async function reloadChart(){await loadKline()}
async function loadSettings(){try{var r=await axios.get(API+'/api/settings');Object.assign(cfg,r.data);var p=cfg.strategies.find(function(s){return s.name==='global_preference'});if(p)prefMode.value=p.params.mode||'balanced'}catch(e){}}
async function toggleStrategy(n,v){try{await axios.post(API+'/api/settings/toggle_strategy',{strategy_name:n,enabled:v});loadSettings()}catch(e){}}
async function setPreference(m){try{await axios.post(API+'/api/settings/preference',{mode:m});prefMode.value=m;loadSettings()}catch(e){}}
async function saveParams(name){try{var p=JSON.parse(editParams.value);await axios.post(API+'/api/settings/update_params',{strategy_name:name,params:p});editing.value='';loadSettings()}catch(e){modalAlert('参数错误','请检查JSON格式\n'+e.message,'⚠️')}}
async function saveDsKey(){try{await axios.post(API+'/api/settings/deepseek_key',{api_key:dsKey.value});loadSettings();modalAlert('已保存','DeepSeek API Key 已更新','✅')}catch(e){modalAlert('保存失败',e.message,'❌')}}
function calStyle(d){if(!d.day&&d.day!==0)return{padding:'5px 3px'};var cp=d.cp,c1='transparent',c2='transparent';if(d.td&&cp){var p=cp.pct;if(p>=80)c1='rgba(16,185,129,0.12)';else if(p>=50)c1='rgba(251,191,36,0.12)';else c1='rgba(239,68,68,0.12)';if(p>=80)c2='rgba(16,185,129,0.25)';else if(p>=50)c2='rgba(251,191,36,0.2)';else c2='rgba(239,68,68,0.25)'}else if(d.td&&!cp){c1='rgba(239,68,68,0.08)';c2='rgba(239,68,68,0.2)'}return{padding:'5px 3px',borderRadius:'4px',fontSize:'10px',textAlign:'center',background:c1,color:d.td?'#fff':'#475569',border:d.td?'1px solid '+c2:'1px solid transparent',opacity:d.future?0.35:1}}
var calTitle=function(d){if(!d.td)return d.date+' 非交易日';if(!d.cp)return d.date+' 无数据(右键采集)';return d.date+' | '+d.cp.rows+'条 ('+d.cp.pct+'%) 右键采集'}
var doSyncDate=function(d){if(!d.td||d.syncing)return;modalShowConfirm('数据采集','确定重新采集 <b>'+d.date+'</b> 的数据？（股票+指数+ETF）',function(){d.syncing=true;axios.post('/api/data_status/sync_date',{date:d.date}).then(function(r){var tid=r.data.task_id;if(!tid)return;var iv=setInterval(function(){axios.get('/api/data_status/sync_status',{params:{task_id:tid}}).then(function(sr){var st=sr.data.task;if(!st||st.status==='running')return;d.syncing=false;clearInterval(iv);if(st.status==='completed'){loadDataStatus();modalAlert('采集完成','✅ '+d.date+'<br>新增股票: '+st.stocks_added+'行<br>指数: '+st.index_rows+'条<br>ETF: '+st.etf_rows+'条<br>共计: '+st.total_after+'行 ('+st.elapsed+'秒)','✅')}else{modalAlert('采集失败',st.error||'未知错误','❌')}})},3000)}).catch(function(e){d.syncing=false;modalAlert('启动失败',e.response?.data?.detail||e.message,'❌')})})}
var doSyncClick=function(d){if(!d.td||d.cp)return;doSyncDate(d)}
async function loadDataStatus(){try{var r=await axios.get(API+'/api/data_status?month='+smonth.value);var d=r.data;if(d.overview)Object.assign(overview,d.overview);
// 构建日历数组
var arr=(d.calendar||[]).map(function(x){return{day:parseInt(x.date.slice(8)),td:x.is_trade_day,cp:x.completeness,future:new Date(x.date)>new Date(),date:x.date}});
// 计算每月1号的星期偏移（周一=0, 周日=6）
var y=parseInt(smonth.value.slice(0,4)),m=parseInt(smonth.value.slice(5,7));
var firstDow=new Date(y,m-1,1).getDay(); // JS: 0=周日
var offset=firstDow===0?6:firstDow-1;   // 转为: 0=周一
var pad=[]; for(var i=0;i<offset;i++) pad.push({day:'',td:false,cp:null,future:false,date:''});
cal.value=pad.concat(arr);missingDates.value=d.missing_dates||[];dlog.value=d.download_log||[];todayStrategy.value=d.today_strategy||null}catch(e){}}

function makeCharts(kd){
var ks=kd.kline, dates=ks.map(function(d){return d.trade_date});
dateRange.value=dates[0]+' ~ '+dates[dates.length-1];
var ohlc=ks.map(function(d){return[d.open,d.close,d.low,d.high]});
var vols=ks.map(function(d){return d.volume});
var bmid=ks.map(function(d){return d.boll_mid}),bup=ks.map(function(d){return d.boll_upper}),blo=ks.map(function(d){return d.boll_lower});
var rs=ks.map(function(d){return d.rsi}),di=ks.map(function(d){return d.dif}),de=ks.map(function(d){return d.dea}),ba=ks.map(function(d){return d.macd_bar});
var vc=ks.map(function(d,i){return ohlc[i][1]>=ohlc[i][0]?'rgba(239,68,68,0.5)':'rgba(16,185,129,0.5)'});
var bc=ba.map(function(v){return v>=0?'rgba(239,68,68,0.6)':'rgba(16,185,129,0.6)'});
// 销毁旧图
['c1','c2','c3','c4'].forEach(function(id){var el=document.getElementById(id);if(el&&el._echart){el._echart.dispose();el._echart=null}});
function m(id,o){var el=document.getElementById(id);if(!el)return;if(el._echart)el._echart.dispose();var c=echarts.init(el);el._echart=c;c.setOption(o);return c}
// 通用 dataZoom 配置: 滑块筛选日期范围
var dz=[{type:'slider',xAxisIndex:0,start:82,end:100,height:25,bottom:4,handleSize:8,borderColor:'#475569',fillerColor:'rgba(59,130,246,0.15)',textStyle:{fontSize:9},zoomLock:true}];
// 共享tooltip+axisPointer配置, 实现跨图联动
var tt={trigger:'axis',axisPointer:{type:'cross',crossStyle:{color:'#64748b'}}};
// 各图的 xAxis 都用同样data+隐藏标签(除K线图)
var xA={type:'category',data:dates,axisLabel:{show:false},axisLine:{lineStyle:{color:'#334155'}}};

var c1=m('c1',{tooltip:tt,grid:{left:'8%',right:'3%',top:18,bottom:55},xAxis:xA,yAxis:{scale:true,splitLine:{lineStyle:{color:'#1e293b'}}},dataZoom:dz,series:[{name:'K线',type:'candlestick',data:ohlc,itemStyle:{color:'#ef4444',color0:'#10b981',borderColor:'#ef4444',borderColor0:'#10b981'}},{name:'上轨',type:'line',data:bup,lineStyle:{color:'#f59e0b',width:1,type:'dashed'},symbol:'none'},{name:'中轨',type:'line',data:bmid,lineStyle:{color:'#60a5fa',width:1.5},symbol:'none'},{name:'下轨',type:'line',data:blo,lineStyle:{color:'#f59e0b',width:1,type:'dashed'},symbol:'none'}]});

// ── URL 路由 ──
function pushHash(tabName, sub){var h='#/'+tabName;if(sub) h+='/'+sub;if(window.location.hash!==h) history.pushState(null,'',h)}
function syncFromHash(){var h=window.location.hash.replace('#/','')||'p';var parts=h.split('/');
if(parts[0]==='d'&&parts[1]){tab.value='d';dcode.value=parts[1];showDetail(parts[1])}
else if(parts[0]==='l'){tab.value='l';stockCat.value=parts[1]||'stock';loadStocks(1)}
else if(parts[0]==='s'){tab.value='s';sigDate.value=todayStr();loadSignals()}
else if(parts[0]==='x'){tab.value='x';loadDataStatus()}
else if(parts[0]==='o'){tab.value='o';loadSettings()}
else{tab.value='p';loadPortfolio()}}
window.addEventListener('hashchange',syncFromHash);
window.addEventListener('popstate',syncFromHash);

function modalShowConfirm(t,m,cb,dt){modal.show=true;modal.type='confirm';modal.icon='🤔';modal.title=t;modal.msg=m;modal.danger=dt||false;modal.confirmText='确 认';modal.callback=cb}
function modalConfirmDanger(t,m,cb){modalShowConfirm(t,m,cb,true);modal.icon='⚠️';modal.confirmText='确认删除'}
function modalClose(){modal.show=false;modal.callback=null}
function modalDoConfirm(){if(modal.callback){var cb=modal.callback;modal.show=false;modal.callback=null;cb()}}
