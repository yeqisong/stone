<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>飞书 Bot 本地测试</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--dim:#94a3b8;--up:#ef4444;--down:#10b981;--blue:#3b82f6;--gold:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
.container{max-width:700px;width:100%;padding:20px}
.header{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;text-align:center}
.header h1{font-size:18px;margin-bottom:4px}.header p{font-size:11px;color:var(--dim)}
.chat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:400px;max-height:60vh;overflow-y:auto;margin-bottom:12px}
.msg{margin-bottom:12px;display:flex;gap:8px}
.msg.user{justify-content:flex-end}
.msg .bubble{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.bot .bubble{background:var(--bg);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg .time{font-size:9px;color:var(--dim);margin-top:4px}
.card-preview{background:var(--bg);border:1px solid var(--blue);border-radius:8px;padding:12px;margin-top:8px}
.card-preview .card-title{font-weight:600;margin-bottom:6px;font-size:13px}
.card-preview button{margin:3px;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:11px;border:1px solid var(--border)}
.card-preview .btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.card-preview .btn-default{background:var(--bg);color:var(--text)}
.input-area{display:flex;gap:8px}
.input-area input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:13px;outline:none}
.input-area input:focus{border-color:var(--blue)}
.input-area button{background:var(--blue);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
.quick-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.quick-actions button{background:var(--bg);color:var(--dim);border:1px solid var(--border);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px;transition:all .15s}
.quick-actions button:hover{color:var(--text);border-color:var(--dim)}
.status{font-size:10px;color:var(--dim);text-align:center;margin-top:8px}
.loading{display:inline-block;width:8px;height:8px;background:var(--dim);border-radius:50%;animation:pulse 1s infinite;margin-right:6px}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div class="container" id="app">

<div class="header">
<h1>🤖 飞书 Bot 本地测试</h1>
<p>模拟飞书消息 → DeepSeek → 工具调用 → 回复 完整链路</p>
</div>

<div class="chat" ref="chatBox">
<div v-if="messages.length===0" style="text-align:center;color:var(--dim);padding:40px">
<p style="font-size:36px;margin-bottom:10px">🤖</p>
<p>发送消息开始测试</p>
<p style="font-size:10px;margin-top:8px">测试 DeepSeek 状态：{{dsStatus}}</p>
</div>
<div v-for="(m,i) in messages" :key="i" :class="'msg '+m.role">
<div>
<div class="bubble" v-html="m.text"></div>
<div class="time">{{m.time}}</div>
<!-- 卡片按钮 -->
<div v-if="m.card" class="card-preview">
<div class="card-title">{{m.card.title||'确认操作'}}</div>
<div v-html="m.card.content" style="font-size:12px;margin-bottom:8px"></div>
<div v-for="(btn,j) in m.card.actions" :key="j">
<button :class="btn.type==='primary'?'btn-primary':'btn-default'"
@click="cardAction(m,i,btn)">{{btn.label}}</button>
</div>
</div>
</div>
</div>
<p v-if="sending" style="color:var(--dim);font-size:11px"><span class="loading"></span>思考中...</p>
</div>

<div class="input-area">
<input v-model="input" @keyup.enter="send" placeholder="输入消息，如：帮我看看贵州茅台 / 添加持仓600519 100股700元 / 切换左侧偏好" :disabled="sending">
<button @click="send" :disabled="sending||!input.trim()">发送</button>
</div>

<div class="quick-actions">
<button @click="input='今天有哪些买入信号'">🔍 今日买点</button>
<button @click="input='帮我看看贵州茅台'">📈 看茅台</button>
<button @click="input='我的持仓怎么样'">💼 持仓分析</button>
<button @click="input='添加持仓 600519 100股 成本700元'">📝 添加持仓</button>
<button @click="input='切换为左侧偏好'">⚙️ 切偏好</button>
<button @click="clearChat">🗑️ 清屏</button>
</div>

<div class="status">DeepSeek: {{dsStatus}} | 请求数: {{reqCount}} | 飞书 Webhook: POST /webhook/feishu</div>

</div>

<script>
const {createApp,ref,reactive,onMounted,nextTick}=Vue;
createApp({setup(){
const input=ref(''),sending=ref(false),reqCount=ref(0),dsStatus=ref('检测中...');
const messages=reactive([]);

function addMsg(role,text,card=null){
  messages.push({role,text,time:new Date().toLocaleTimeString(),card});
}

// 格式化为 HTML（处理换行）
function fmtHTML(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}

async function send(){
  const txt=input.value.trim(); if(!txt||sending.value)return;
  input.value=''; sending.value=true; reqCount.value++;
  addMsg('user',fmtHTML(txt));

  try{
    const r=await axios.post('/webhook/feishu',{
      type:'message',
      event:{message:{message_type:'text',content:JSON.stringify({text:txt})}}
    });

    const d=r.data;
    if(typeof d==='object'&&d.msg_type==='interactive'){
      // 卡片响应
      const card=d.card||{};
      const header=card.header||{};
      const elements=card.elements||[];
      let content='',actions=[],title=header.title?.content||'';

      for(const el of elements){
        if(el.tag==='div'&&el.text?.content) content+=fmtHTML(el.text.content)+'<br>';
        if(el.tag==='action'){
          for(const a of (el.actions||[])){
            if(a.tag==='button') actions.push({label:a.text?.content||'',type:a.type||'',value:a.value||{}});
          }
        }
      }
      addMsg('bot','📋 飞书卡片:',{title,content,actions});
    }else if(typeof d==='object'&&d.msg_type==='text'){
      addMsg('bot',fmtHTML(d.content?.text||JSON.stringify(d)));
    }else{
      addMsg('bot',fmtHTML(JSON.stringify(d,null,2)));
    }
  }catch(e){
    const err=e.response?.data?.detail||e.message;
    addMsg('bot','❌ 请求失败: '+fmtHTML(String(err)));
  }
  sending.value=false;
  nextTick(()=>{const box=document.querySelector('.chat');if(box)box.scrollTop=box.scrollHeight});
}

async function cardAction(msg,idx,btn){
  sending.value=true; reqCount.value++;
  try{
    const r=await axios.post('/webhook/feishu',{
      type:'card_action',
      action:{value:typeof btn.value==='string'?btn.value:JSON.stringify(btn.value)}
    });
    const d=r.data;
    if(typeof d==='object'&&d.msg_type==='text'){
      addMsg('bot',fmtHTML(d.content?.text||JSON.stringify(d)));
    }else if(typeof d==='object'&&d.msg_type==='interactive'){
      addMsg('bot','📋 飞书卡片(嵌套):');
    }else{
      addMsg('bot',fmtHTML(JSON.stringify(d)));
    }
  }catch(e){
    addMsg('bot','❌ 操作失败: '+fmtHTML(String(e.response?.data?.detail||e.message)));
  }
  sending.value=false;
  nextTick(()=>{const box=document.querySelector('.chat');if(box)box.scrollTop=box.scrollHeight});
}

function clearChat(){messages.splice(0,messages.length)}

onMounted(async()=>{
  try{const r=await axios.get('/health');dsStatus.value=r.data.status==='ok'?'✅ 服务正常':'⚠️ '+r.data.status}catch(e){dsStatus.value='❌ 无法连接'}
});

return{input,sending,messages,reqCount,dsStatus,send,cardAction,clearChat,fmtHTML}
}}).mount('#app');
</script>
</body>
</html>
