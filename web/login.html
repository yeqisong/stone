<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录 — 个股买卖点监测系统</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--dim:#94a3b8;--blue:#3b82f6;--up:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:380px;max-width:90vw}
.login-box h1{font-size:20px;text-align:center;margin-bottom:4px}
.login-box .sub{font-size:11px;color:var(--dim);text-align:center;margin-bottom:28px}
.login-box label{font-size:11px;color:var(--dim);display:block;margin-bottom:4px;margin-top:14px}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;outline:none;transition:border-color .15s}
.login-box input:focus{border-color:var(--blue)}
.login-box button{width:100%;background:var(--blue);color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;margin-top:20px;transition:opacity .15s}
.login-box button:hover{opacity:.9}
.login-box .error{color:var(--up);font-size:11px;text-align:center;margin-top:12px;min-height:16px}
.login-box .hint{font-size:10px;color:var(--dim);text-align:center;margin-top:16px}
</style>
</head>
<body>

<div class="login-box" id="app">
<h1>📊 个股买卖点监测系统</h1>
<div class="sub">Stock Signal Monitor</div>

<label>用户名</label>
<input v-model="username" @keyup.enter="doLogin" placeholder="admin" autofocus>

<label>密码</label>
<input v-model="password" type="password" @keyup.enter="doLogin" placeholder="••••••">

<button @click="doLogin" :disabled="loading">{{loading?'登录中...':'登 录'}}</button>
<div class="error">{{error}}</div>
<div class="hint">默认账号 admin / admin123<br>生产环境请在 .env 中修改</div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/axios/1.6.7/axios.min.js"></script>
<script>
const {createApp,ref}=Vue;
createApp({setup(){
const username=ref(''),password=ref(''),error=ref(''),loading=ref(false);

async function doLogin(){
  error.value='';
  if(!username.value||!password.value){error.value='请输入用户名和密码';return}
  loading.value=true;
  try{
    const r=await axios.post('/api/login',{username:username.value,password:password.value});
    localStorage.setItem('token',r.data.token);
    localStorage.setItem('username',r.data.username);
    window.location.href='/';
  }catch(e){
    error.value=e.response?.data?.detail||'登录失败，请检查用户名密码';
  }
  loading.value=false;
}

// 已登录则直接跳转
if(localStorage.getItem('token')) window.location.href='/';

return{username,password,error,loading,doLogin}
}}).mount('#app');
</script>
</body>
</html>
